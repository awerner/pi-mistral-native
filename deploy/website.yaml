# K3s sample for serving the static documentation site image.
# Apply with: kubectl apply -f deploy/website.yaml
#
# The image lives in the Forgejo instance registry, which by default requires
# authentication. Create the pull secret once and uncomment imagePullSecrets:
#
#   kubectl create secret docker-registry forgejo-pull \
#     --docker-server=git.techlex.space \
#     --docker-username=<forgejo-user> \
#     --docker-password=<token-or-password> \
#     -n mistral-docs
#
# A read-only token scoped to this repository suffices.

apiVersion: v1
kind: Namespace
metadata:
  name: mistral-docs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mistral-docs
  namespace: mistral-docs
  labels:
    app: mistral-docs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mistral-docs
  template:
    metadata:
      labels:
        app: mistral-docs
    spec:
      # imagePullSecrets:
      #   - name: forgejo-pull
      containers:
        - name: site
          image: git.techlex.space/agentic/pi-mistral-native-site:main
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          # The site is fully static; nginx never needs a restart, but the
          # probes let a node drain wait for in-flight responses.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: mistral-docs
  namespace: mistral-docs
spec:
  selector:
    app: mistral-docs
  ports:
    - name: http
      port: 80
      targetPort: http
---
# K3s ships traefik as its ingress controller; this is the generic pattern
# it expects. Replace the host with your own before applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mistral-docs
  namespace: mistral-docs
spec:
  rules:
    - host: mistral-docs.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mistral-docs
                port:
                  name: http
