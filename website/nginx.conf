# Minimal static-site server. Starlight emits real .html files in directory
# format (/stream/index.html), so plain file lookup covers every route;
# try_files also serves extensionless paths without a redirect. The 404
# page is rendered by the site itself.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects so the site works behind Ingress rules and
    # localhost port-forwards.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed build assets never change: cache hard.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cheap in-cluster probe endpoint.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
