name: Website image

# The site image is rebuilt when the website or the docs it ingests change,
# plus manual rebuilds via workflow_dispatch.
on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "docs/**"
      - "assets/**"
      - "README.md"
      - ".forgejo/workflows/website.yaml"
  workflow_dispatch:

env:
  IMAGE: git.techlex.space/agentic/pi-mistral-native-site

jobs:
  website-image:
    # Root ci.yaml already runs the full check/test suite; this job builds
    # and publishes the static docs site image only.
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install buildah
        run: |
          apt-get update
          apt-get install -y --no-install-recommends buildah ca-certificates

      # Rootless-in-container pattern: inside the act container there is no
      # Docker daemon, and chroot isolation avoids the unshare/namespace
      # restrictions of the Kubernetes-based runner. vfs keeps the storage
      # simple (no overlay on the runner's filesystem).
      - name: Configure rootless buildah
        run: |
          mkdir -p "${HOME}/.config/containers"
          cat <<'EOF' > "${HOME}/.config/containers/storage.conf"
          [storage]
          driver = "vfs"
          [storage.options]
          ignore_chown_errors = "true"
          EOF

      # The runner-provided token authenticates against this instance's
      # registry. The authfile is local to the job container and never
      # printed; the token itself is never echoed or logged.
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          registry="${GITHUB_SERVER_URL#https://}"
          registry="${registry#http://}"
          auth="$(printf '%s:%s' "$GITHUB_ACTOR" "$REGISTRY_TOKEN" | base64)"
          cat <<EOF > "${HOME}/.config/containers/auth.json"
          {"auths":{"${registry}":{"auth":"${auth}"}}}
          EOF

      - name: Build and push image
        run: |
          buildah --storage-driver=vfs bud \
            --isolation chroot \
            --layers \
            --authfile "${HOME}/.config/containers/auth.json" \
            -t "${IMAGE}:${GITHUB_REF_NAME}" \
            -f website/Dockerfile \
            .
          buildah --storage-driver=vfs push \
            --authfile "${HOME}/.config/containers/auth.json" \
            "${IMAGE}:${GITHUB_REF_NAME}" \
            "docker://${IMAGE}:${GITHUB_REF_NAME}"
